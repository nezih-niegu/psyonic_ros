services:
  ros2_ah:
    container_name: ros2_ah
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=100
      - ROS_LOCALHOST_ONLY=0
      # The config lives in this repo at docker/cyclonedds.xml. An earlier
      # version mounted /cyclonedds.xml from the HOST ROOT, which does not
      # exist - Docker then created an empty DIRECTORY there and mounted that,
      # so CycloneDDS was handed a directory as its config file. Discovery
      # stalled intermittently: `ros2 node list` hanging, topics visible to
      # `ros2 topic hz` but not to a node subscribing to the same topic.
      - CYCLONEDDS_URI=file:///etc/cyclonedds/cyclonedds.xml
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Anything NOT under a bind mount lives in the container's writable
      # layer and is destroyed by `docker compose down`, `build`, or
      # `up --force-recreate`.
      - ../src:/ws/src
      - ../src/vendor:/ws/vendor  # models, .deb files, anything downloaded
      - ../install:/ws/install    # build products, so a rebuild is not needed
      - ../build:/ws/build
      - ../.ros:/root/.ros        # calibration, logs
    stdin_open: true
    tty: true
    restart: unless-stopped
