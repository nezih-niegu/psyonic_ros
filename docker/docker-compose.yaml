services:
  ros2_ah:
    container_name: ros2_ah
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=100
      - ROS_LOCALHOST_ONLY=0
      # CYCLONEDDS_URI removed on purpose: it pointed at /cyclonedds.xml on the
      # host, which does not exist, so Docker created an empty DIRECTORY and
      # mounted it. CycloneDDS then failed to parse its config and discovery
      # stalled intermittently - `ros2 node list` hanging, topics visible to
      # one process but not another. Defaults are correct for a single host
      # with network_mode: host. To tune it later, create a real XML file and
      # mount it then.
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Anything NOT under a bind mount lives in the container's writable
      # layer and is destroyed by `docker compose down`, `build`, or
      # `up --force-recreate`.
      - ../src:/ws/src
      - ../vendor:/ws/vendor      # models, .deb files, anything downloaded
      - ../install:/ws/install    # build products, so a rebuild is not needed
      - ../build:/ws/build
      - ../.ros:/root/.ros        # calibration, logs
    stdin_open: true
    tty: true
    restart: unless-stopped
